[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "d2draft"
version = "0.1.0"
description = "Dota 2 Assistant Telegram Bot"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.4",
    "supabase>=2.0",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "cloudscraper>=1.2.71",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["bot", "core", "services", "repositories", "clients", "scheduler", "db"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["N818"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest-cov>=7.0.0",
]
